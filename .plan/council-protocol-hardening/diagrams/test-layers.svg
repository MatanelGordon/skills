<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" role="img" aria-labelledby="t d">
  <title id="t">Two test layers for the Council helper</title>
  <desc id="d">Fast tests in council-protocol.test.mjs check the protocol mechanics and run inside npm test in normal CI. An opt-in hosted smoke run saves a ledger outside the repo, and the helper's verify-live-smoke command checks it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .new { fill: #ddf4ff; stroke: #0969da; }
    .gone { fill: none; stroke: #818b98; stroke-dasharray: 6 4; }
    .ask { fill: #fff8c5; stroke: #9a6700; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .wire { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .tip { fill: #818b98; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .caps { font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { stroke: #3d444d; }
      .card { fill: #151b23; stroke: #3d444d; }
      .new { fill: #121d2f; stroke: #4493f8; }
      .gone { stroke: #656c76; }
      .ask { fill: #272115; stroke: #d29922; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .wire { stroke: #656c76; }
      .tip { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="216" rx="8"/>

  <text class="muted caps" x="24" y="36">FAST LAYER: PROTOCOL MECHANICS, EVERY CI RUN</text>
  <rect class="card" x="24" y="48" width="224" height="48" rx="8"/>
  <text class="ink" x="136" y="69" text-anchor="middle">council-protocol.test.mjs</text>
  <text class="muted small" x="136" y="86" text-anchor="middle">node --test</text>
  <path class="wire" d="M248 72 H292" marker-end="url(#arrow)"/>
  <rect class="card" x="296" y="48" width="176" height="48" rx="8"/>
  <text class="ink" x="384" y="69" text-anchor="middle">npm test</text>
  <text class="muted small" x="384" y="86" text-anchor="middle">normal CI</text>

  <text class="muted caps" x="24" y="132">LIVE LAYER, OPT-IN: REAL AGENT ISOLATION</text>
  <rect class="card" x="24" y="144" width="224" height="48" rx="8"/>
  <text class="ink" x="136" y="165" text-anchor="middle">Hosted smoke run</text>
  <text class="muted small" x="136" y="182" text-anchor="middle">live-smoke.md</text>
  <path class="wire" d="M248 168 H292" marker-end="url(#arrow)"/>
  <rect class="card" x="296" y="144" width="176" height="48" rx="8"/>
  <text class="ink" x="384" y="165" text-anchor="middle">ledger.json</text>
  <text class="muted small" x="384" y="182" text-anchor="middle">outside the repo</text>
  <path class="wire" d="M472 168 H516" marker-end="url(#arrow)"/>
  <rect class="card" x="520" y="144" width="176" height="48" rx="8"/>
  <text class="ink" x="608" y="165" text-anchor="middle">verify-live-smoke</text>
  <text class="muted small" x="608" y="182" text-anchor="middle">helper CLI</text>
</svg>

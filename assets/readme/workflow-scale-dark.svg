<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" role="img" aria-labelledby="title desc">
  <title id="title">Scale the workflow to the change</title>
  <desc id="desc">How many workflow steps each kind of change gets. Typo, rename or comment: just do it, implement only. Small bug fix: a red test, the fix, and a commit that says why. Feature or refactor: all six steps. Multi-seam, multi-day work: all six steps, planned with deep-plan and implemented with parallel-build. Every step a change skips is marked skip.</desc>
  <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .muted { fill: #9198a1; font-size: 11.5px; }
      .label { fill: #9198a1; font-size: 10.5px; letter-spacing: .12em; font-weight: 600; }
      .title { font-size: 15px; font-weight: 650; }
      .skill { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #bc8cff; font-size: 11px; }
      .wire { fill: none; stroke: #3d444d; stroke-width: 2; stroke-linecap: round; }
      .cell { animation: pop 7.0s ease-out infinite; }
      @keyframes pop { 0%, 3% { opacity: 0; transform: translateY(4px); } 8%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) { .cell { animation: none; } }
  </style>
  
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="959" height="325" rx="16" fill="#161b22" stroke="#30363d"/>
  <rect x=".5" y=".5" width="959" height="325" rx="16" fill="url(#grid)" opacity=".7"/>
  <text class="label" x="30" y="36">SCALE IT TO THE CHANGE</text>
  <text class="label" x="314.0" y="58" text-anchor="middle">RESEARCH</text><text class="label" x="428.0" y="58" text-anchor="middle">PLAN</text><text class="label" x="542.0" y="58" text-anchor="middle">TEST FIRST</text><text class="label" x="656.0" y="58" text-anchor="middle">IMPLEMENT</text><text class="label" x="770.0" y="58" text-anchor="middle">REVIEW</text><text class="label" x="884.0" y="58" text-anchor="middle">COMMIT</text>
  <text class="name" x="30" y="90" font-size="13.5" font-weight="650">Typo, rename, comment</text><text class="muted" x="30" y="107">just do it</text><rect x="262" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="314.0" y="97.0" text-anchor="middle" class="muted">skip</text><rect x="376" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="428.0" y="97.0" text-anchor="middle" class="muted">skip</text><rect x="490" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="542.0" y="97.0" text-anchor="middle" class="muted">skip</text><rect x="604" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:0.96s"><rect x="604" y="74" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><text x="656.0" y="97.0" text-anchor="middle" class="skill">just do it</text></g><rect x="718" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="770.0" y="97.0" text-anchor="middle" class="muted">skip</text><rect x="832" y="74" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="884.0" y="97.0" text-anchor="middle" class="muted">skip</text><text class="name" x="30" y="144" font-size="13.5" font-weight="650">Small bug fix</text><text class="muted" x="30" y="161">reproduce, fix, explain</text><rect x="262" y="128" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="314.0" y="151.0" text-anchor="middle" class="muted">skip</text><rect x="376" y="128" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><text x="428.0" y="151.0" text-anchor="middle" class="muted">skip</text><rect x="490" y="128" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" s
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" role="img" aria-labelledby="t d">
  <title id="t">The three phases and what each one delivers</title>
  <desc id="d">Phase 1 writes the fast tests first, then the protocol helper. Phase 2 splits SKILL.md into four references, rewrites it as a router, adds the evals and wires the fast tests into npm test. Phase 3 is an independent review plus a forward test.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .new { fill: #ddf4ff; stroke: #0969da; }
    .gone { fill: none; stroke: #818b98; stroke-dasharray: 6 4; }
    .ask { fill: #fff8c5; stroke: #9a6700; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .wire { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .tip { fill: #818b98; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .caps { font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { stroke: #3d444d; }
      .card { fill: #151b23; stroke: #3d444d; }
      .new { fill: #121d2f; stroke: #4493f8; }
      .gone { stroke: #656c76; }
      .ask { fill: #272115; stroke: #d29922; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .wire { stroke: #656c76; }
      .tip { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="296" rx="8"/>

  <text class="muted caps" x="24" y="36">PHASE 1 · FOUNDATION</text>
  <rect class="zone" x="24" y="48" width="192" height="120" rx="8"/>
  <rect class="card" x="32" y="56" width="176" height="48" rx="8"/>
  <text class="ink strong" x="120" y="77" text-anchor="middle">Fast tests</text>
  <text class="muted small" x="120" y="94" text-anchor="middle">written first</text>
  <rect class="card" x="32" y="112" width="176" height="48" rx="8"/>
  <text class="ink strong" x="120" y="133" text-anchor="middle">Protocol helper</text>
  <text class="muted small" x="120" y="150" text-anchor="middle">council-protocol.mjs</text>

  <path class="wire" d="M216 80 H260" marker-end="url(#arrow)"/>

  <text class="muted caps" x="264" y="36">PHASE 2 · INTEGRATION</text>
  <rect class="zone" x="264" y="48" width="192" height="232" rx="8"/>
  <rect class="card" x="272" y="56" width="176" height="48" rx="8"/>
  <text class="ink strong" x="360" y="77" text-anchor="middle">4 references</text>
  <text class="muted small" x="360" y="94" text-anchor="middle">split out of SKILL.md</text>
  <rect class="card" x="272" y="112" width="176" height="48" rx="8"/>
  <text class="ink strong" x="360" y="133" text-anchor="middle">SKILL.md</text>
  <text class="muted small" x="360" y="150" text-anchor="middle">router, 220 lines max</text>
  <rect class="card" x="272" y="168" width="176" height="48" rx="8"/>
  <text class="ink strong" x="360" y="189" text-anchor="middle">Evals</text>
  <text class="muted small" x="360" y="206" text-anchor="middle">routing, live smoke</text>
  <rect class="card" x="272" y="224" width="176" height="48" rx="8"/>
  <text class="ink strong" x="360" y="245" text-anchor="middle">package.json</text>
  <text class="muted small" x="360" y="262" text-anchor="middle">npm test runs Council</text>

  <path class="wire" d="M456 80 H500" marker-end="url(#arrow)"/>

  <text class="muted caps" x="504" y="36">PHASE 3 · REVIEW</text>
  <rect class="zone" x="504" y="48" width="192" height="64" rx="8"/>
  <rect class="card" x="512" y="56" width="176" height="48" rx="8"/>
  <text class="ink strong" x="600" y="77" text-anchor="middle">Independent review</text>
  <text class="muted small" x="600" y="94" text-anchor="middle">plus a forward test</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" role="img" aria-labelledby="t d">
  <title id="t">Council before and after the protocol helper</title>
  <desc id="d">Today the host agent does the prompt bookkeeping itself, and long round-two packets may be compacted on the way to the isolated agents. After this plan, council-protocol.mjs does the bookkeeping between the host agent and the isolated agents, and fails closed instead of shortening a packet.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .new { fill: #ddf4ff; stroke: #0969da; }
    .gone { fill: none; stroke: #818b98; stroke-dasharray: 6 4; }
    .ask { fill: #fff8c5; stroke: #9a6700; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .wire { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .tip { fill: #818b98; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .caps { font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { stroke: #3d444d; }
      .card { fill: #151b23; stroke: #3d444d; }
      .new { fill: #121d2f; stroke: #4493f8; }
      .gone { stroke: #656c76; }
      .ask { fill: #272115; stroke: #d29922; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .wire { stroke: #656c76; }
      .tip { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="232" rx="8"/>

  <text class="muted caps" x="24" y="36">TODAY</text>
  <rect class="card" x="24" y="48" width="192" height="48" rx="8"/>
  <text class="ink strong" x="120" y="69" text-anchor="middle">Host agent</text>
  <text class="muted small" x="120" y="86" text-anchor="middle">bookkeeping by prompt</text>
  <text class="muted small" x="376" y="64" text-anchor="middle">packets may be compacted</text>
  <path class="wire" d="M216 72 H532" marker-end="url(#arrow)"/>
  <rect class="card" x="536" y="48" width="160" height="48" rx="8"/>
  <text class="ink" x="616" y="77" text-anchor="middle">Isolated agents</text>

  <text class="muted caps" x="24" y="132">AFTER THIS PLAN</text>
  <rect class="card" x="24" y="144" width="192" height="48" rx="8"/>
  <text class="ink strong" x="120" y="165" text-anchor="middle">Host agent</text>
  <text class="muted small" x="120" y="182" text-anchor="middle">keeps the judgment</text>
  <path class="wire" d="M216 168 H268" marker-end="url(#arrow)"/>
  <rect class="new" x="272" y="144" width="208" height="48" rx="8"/>
  <text class="ink strong" x="376" y="165" text-anchor="middle">council-protocol.mjs</text>
  <text class="muted small" x="376" y="182" text-anchor="middle">bookkeeping, fails closed</text>
  <path class="wire" d="M480 168 H532" marker-end="url(#arrow)"/>
  <rect class="card" x="536" y="144" width="160" height="48" rx="8"/>
  <text class="ink" x="616" y="173" text-anchor="middle">Isolated agents</text>

  <rect class="new" x="24" y="208" width="12" height="12" rx="3"/>
  <text class="muted small" x="44" y="219">new in this plan</text>
</svg>

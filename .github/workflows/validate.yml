name: validate
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'schedule'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 20 }
          - { os: windows-latest, node: 20 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate reads git history to find retired skill names
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run test:planning-eval
  mutation-smoke:
    if: github.event_name != 'schedule'
    name: test-only import smoke / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:mutation-smoke
  browser-capture:
    if: github.event_name != 'schedule'
    name: Browser capture / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run setup:browser-capture
      - run: npm run test:browser-capture
      - run: npm run test:impeccable-lite
  provenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: PSTACK provenance drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: >-
          node skills/mutation-testing/scripts/mutation-protocol.mjs
          provenance-check
          --manifest skills/mutation-testing/references/provenance.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rename board</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }
    .modal {
      width: 360px;
      margin: 40px auto 0;
      padding: 24px;
      background: #ffffff;
      border-radius: 8px;
    }
    .modal h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .modal label {
      display: block;
      margin-bottom: 4px;
    }
    .modal input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      padding: 8px;
    }
    .btn-confirm {
      padding: 8px 16px;
      border: 0;
      border-radius: 6px;
      background: #6b7280;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rename-title">
      <h2 id="rename-title">Rename board</h2>
      <label for="board-name">Board name</label>
      <input id="board-name" type="text" value="Q4 launch">
      <button class="btn-confirm" type="button">Save name</button>
    </div>
  </div>
</body>
</html>

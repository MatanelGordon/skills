d"/></g><rect x="490" y="182" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:0.80s"><rect x="490" y="182" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M536.0 201.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="604" y="182" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.12s"><rect x="604" y="182" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M650.0 201.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="718" y="182" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.44s"><rect x="718" y="182" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M764.0 201.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="832" y="182" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.76s"><rect x="832" y="182" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M878.0 201.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="name" x="30" y="252" font-size="13.5" font-weight="650">Multi-seam, multi-day</text><text class="muted" x="30" y="269">whole pipeline, in parallel</text><rect x="262" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:0.24s"><rect x="262" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M308.0 255.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="376" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:0.56s"><rect x="376" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><text x="428.0" y="259.0" text-anchor="middle" class="skill">deep-plan</text></g><rect x="490" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:0.88s"><rect x="490" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M536.0 255.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="604" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.20s"><rect x="604" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><text x="656.0" y="259.0" text-anchor="middle" class="skill">parallel-build</text></g><rect x="718" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.52s"><rect x="718" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M764.0 255.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="832" y="236" width="104" height="38" rx="9" fill="none" stroke="#3d444d" stroke-dasharray="3 4"/><g class="cell" style="animation-delay:1.84s"><rect x="832" y="236" width="104" height="38" rx="9" fill="#271a3d" stroke="#bc8cff" stroke-width="1.25"/><path d="M878.0 255.0 l4 4 l8-8.5" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="muted" x="30" y="302">Every change, however small: inspect first, define done, verify, and say what you skipped.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Scale the workflow to the change</title>
  <desc id="desc">A typo uses the mandatory core. A small bug uses a reproducing test, fix, verification and why-commit. A feature uses research, planning, TDD, implementation, test hardening, parallel review and mutation discovery, joined verification and commit. Multi-seam work uses the full pipeline with deep planning and parallel build.</desc>
  <defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8dee4"/></pattern></defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill:#1f2328; }
    .label { fill:#59636e; font-size:10px; letter-spacing:.12em; font-weight:700; }
    .name { font-size:14px; font-weight:700; }
    .hint { fill:#59636e; font-size:11px; }
    .flow { fill:#8250df; font:11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card { fill:#fff; stroke:#d0d7de; stroke-width:1.1; }
    .full { fill:#fbefff; stroke:#8250df; stroke-width:1.2; }
    .core { fill:#dafbe1; stroke:#1a7f37; stroke-width:1.1; }
  </style>
  <rect x=".5" y=".5" width="959" height="339" rx="16" fill="#f6f8fa" stroke="#d0d7de"/><rect x=".5" y=".5" width="959" height="339" rx="16" fill="url(#grid)" opacity=".65"/>
  <text class="label" x="28" y="34">SCALE IT TO THE CHANGE</text>

  <g transform="translate(24 52)"><rect class="card" width="912" height="56" rx="11"/><text class="name" x="18" y="24">Typo, rename, comment</text><text class="hint" x="18" y="42">mandatory core only</text><rect class="core" x="250" y="11" width="640" height="34" rx="17"/><text class="flow" x="570" y="32" text-anchor="middle">inspect → define done → edit → verify → report omissions</text></g>
  <g transform="translate(24 118)"><rect class="card" width="912" height="56" rx="11"/><text class="name" x="18" y="24">Small bug fix</text><text class="hint" x="18" y="42">reproduce, fix, explain</text><rect class="core" x="250" y="11" width="640" height="34" rx="17"/><text class="flow" x="570" y="32" text-anchor="middle">RED regression → fix → GREEN → verify → commit why</text></g>
  <g transform="translate(24 184)"><rect class="card" width="912" height="56" rx="11"/><text class="name" x="18" y="24">Feature or refactor</text><text class="hint" x="18" y="42">the whole pipeline</text><rect class="full" x="250" y="8" width="640" height="40" rx="10"/><text class="flow" x="570" y="25" text-anchor="middle">research → plan → TDD → implement → harden</text><text class="flow" x="570" y="40" text-anchor="middle">review ∥ mutate → guarded tests → verify → commit</text></g>
  <g transform="translate(24 250)"><rect class="card" width="912" height="56" rx="11"/><text class="name" x="18" y="24">Multi-seam, multi-day</text><text class="hint" x="18" y="42">full pipeline, safely parallel</text><rect class="full" x="250" y="8" width="640" height="40" rx="10"/><text class="flow" x="570" y="25" text-anchor="middle">deep-plan → parallel-build → harden</text><text class="flow" x="570" y="40" text-anchor="middle">review ∥ mutate (≤3 disjoint lanes) → joined proof</text></g>
  <text class="hint" x="28" y="327">Every row still inspects first, defines done, verifies evidence, and names what was skipped.</text>
</svg>

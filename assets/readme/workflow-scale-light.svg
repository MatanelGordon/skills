<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Scale the workflow to the change</title>
  <desc id="desc">A stage matrix for four change sizes. Features default to research, planning, test-first implementation, hardening, bounded review convergence, verification and commit. Mutation testing is optional under a risk and value rule.</desc>
  <defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8dee4"/></pattern></defs>
  <style>
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#1f2328; }
    .label { fill:#59636e; font-size:9px; letter-spacing:.08em; font-weight:700; }
    .name { font-size:13px; font-weight:700; }
    .hint,.skip { fill:#59636e; font-size:10px; }
    .cell { fill:#fff; stroke:#d0d7de; }
    .yes { fill:#dafbe1; stroke:#1a7f37; }
    .optional { fill:#fbefff; stroke:#8250df; stroke-dasharray:4 3; }
    .mark { font:10px ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; }
    .pop { animation:pop 7s ease-out infinite; transform-origin:center; }
    @keyframes pop { 0%,4% { opacity:.4; } 12%,88% { opacity:1; } 96%,100% { opacity:.4; } }
    @media (prefers-reduced-motion: reduce) { .pop { animation:none; opacity:1; } }
  </style>
  <rect x=".5" y=".5" width="959" height="349" rx="16" fill="#f6f8fa" stroke="#d0d7de"/><rect x=".5" y=".5" width="959" height="349" rx="16" fill="url(#grid)" opacity=".65"/>
  <text class="label" x="26" y="32">SCALE IT TO THE CHANGE · DEFAULTS + EXPLICIT SKIPS</text>
  <text class="label" x="265" y="61" text-anchor="middle">RESEARCH</text><text class="label" x="354" y="61" text-anchor="middle">PLAN</text><text class="label" x="443" y="61" text-anchor="middle">TEST</text><text class="label" x="532" y="61" text-anchor="middle">IMPLEMENT</text><text class="label" x="621" y="61" text-anchor="middle">HARDEN</text><text class="label" x="710" y="61" text-anchor="middle">REVIEW</text><text class="label" x="799" y="61" text-anchor="middle">MUTATE</text><text class="label" x="888" y="61" text-anchor="middle">VERIFY/COMMIT</text>
  <g transform="translate(24 73)"><text class="name" y="20">Typo / comment</text><text class="hint" y="37">mandatory core</text><g transform="translate(200)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(289)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(378)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g class="pop" style="animation-delay:.3s" transform="translate(467)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">edit</text></g><g transform="translate(556)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(645)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(734)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g class="pop" style="animation-delay:.6s" transform="translate(823)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">check</text></g></g>
  <g transform="translate(24 132)"><text class="name" y="20">Small bug</text><text class="hint" y="37">reproduce + fix</text><g transform="translate(200)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(289)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g class="pop" style="animation-delay:.2s" transform="translate(378)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">RED</text></g><g class="pop" style="animation-delay:.4s" transform="translate(467)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">fix</text></g><g transform="translate(556)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(645)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">skip</text></g><g transform="translate(734)"><rect class="cell" width="82" height="44" rx="8"/><text class="skip" x="41" y="27" text-anchor="middle">risk rule</text></g><g class="pop" style="animation-delay:.8s" transform="translate(823)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">why</text></g></g>
  <g transform="translate(24 191)"><text class="name" y="20">Feature / refactor</text><text class="hint" y="37">default feature path</text><g class="pop" style="animation-delay:.1s" transform="translate(200)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">reuse</text></g><g class="pop" style="animation-delay:.2s" transform="translate(289)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">plan</text></g><g class="pop" style="animation-delay:.3s" transform="translate(378)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">TDD</text></g><g class="pop" style="animation-delay:.4s" transform="translate(467)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">build</text></g><g class="pop" style="animation-delay:.5s" transform="translate(556)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">edges</text></g><g class="pop" style="animation-delay:.6s" transform="translate(645)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">2+ passes</text></g><g class="pop" style="animation-delay:.7s" transform="translate(734)"><rect class="optional" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">risk rule</text></g><g class="pop" style="animation-delay:.8s" transform="translate(823)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">proof</text></g></g>
  <g transform="translate(24 250)"><text class="name" y="20">Multi-seam</text><text class="hint" y="37">deep + parallel</text><g class="pop" style="animation-delay:.1s" transform="translate(200)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">reuse</text></g><g class="pop" style="animation-delay:.2s" transform="translate(289)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">deep-plan</text></g><g class="pop" style="animation-delay:.3s" transform="translate(378)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">TDD</text></g><g class="pop" style="animation-delay:.4s" transform="translate(467)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">parallel</text></g><g class="pop" style="animation-delay:.5s" transform="translate(556)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">edges</text></g><g class="pop" style="animation-delay:.6s" transform="translate(645)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">2+ passes</text></g><g class="pop" style="animation-delay:.7s" transform="translate(734)"><rect class="optional" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">per slice</text></g><g class="pop" style="animation-delay:.8s" transform="translate(823)"><rect class="yes" width="82" height="44" rx="8"/><text class="mark" x="41" y="27" text-anchor="middle">proof</text></g></g>
  <text class="hint" x="26" y="330">Dashed purple = opt-in when explicit or when configured, critical, scoped and budgeted.</text>
</svg>
